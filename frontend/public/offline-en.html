<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001D40">
  <meta name="robots" content="noindex">
  <title>Offline — Scientific Affairs Portal | Al-Turath University</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #FAFBFC; color: #192a3d;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.7;
    }
    main {
      width: 100%; max-width: 440px; text-align: center; background: #fff;
      border: 1px solid #e1e8ed; border-top: 4px solid #001D40; border-radius: 16px; padding: 32px 24px;
    }
    img { width: 72px; height: auto; }
    h1 { margin: 16px 0 4px; font-size: 1.25rem; color: #001D40; }
    p { margin: 0 0 8px; }
    .alt { color: #4a5a6c; font-size: 0.9rem; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e1e8ed; }
    .alt a { color: #001D40; }
    a.button {
      display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 10px;
      background: #001D40; color: #fff; text-decoration: none; font-weight: 600;
    }
    a.button:hover, a.button:focus-visible { background: #890015; outline: none; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/crest.png" width="634" height="844" alt="Al-Turath University logo">
    <h1>You are offline</h1>
    <p>The Scientific Affairs Portal of Al-Turath University could not be reached. Check your connection and try again.</p>
    <a class="button" href="/en" onclick="location.reload(); return false;">Try again</a>
    <p class="alt"><a href="/ar" lang="ar" hreflang="ar">العربية</a></p>
  </main>
</body>
</html>
